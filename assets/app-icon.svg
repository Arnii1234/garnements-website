<!-- garnements home-screen icon, from Arne's "SVG/Asset 3.svg".
     The mark is portrait (20.08x24.92) and an app icon is square, so the box is
     squared off the taller side with room to breathe and the art centred in
     it — iOS rounds the corners itself, and anything near an edge loses to
     that. Filled paper rather than transparency for the same reason: iOS
     composites a transparent icon onto black. -->
